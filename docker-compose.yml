# 로컬 개발용 PostgreSQL 16. 127.0.0.1에만 바인딩한다.
services:
  db:
    image: postgres:16
    container_name: ekyc-db
    environment:
      POSTGRES_USER: ekyc
      POSTGRES_PASSWORD: ekyc
      POSTGRES_DB: ekyc
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ekyc-pgdata:/var/lib/postgresql/data
      # 새 볼륨으로 처음 올릴 때 pytest용 ekyc_test DB를 만든다
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekyc -d ekyc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ekyc-pgdata:
