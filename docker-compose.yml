# 로컬 실습 스택. 운영 형태(EC2: Apache 2.4 → Gunicorn → Flask, RDS PostgreSQL)를
# 그대로 줄여 놓은 것이다. 진단 대상이 앱 하나가 아니라 웹서버·OS·DBMS까지 생긴다.
#
#   브라우저 ──9443──▶ web(Apache) ──8000──▶ app(Gunicorn+Flask) ──5432──▶ db(PostgreSQL)
#
# 주소·포트·도메인은 .env 에서 읽는다(.env.example 의 "compose 스택" 절).
# 아무것도 넣지 않으면 예전과 같은 로컬 값(127.0.0.1, localhost:9443)으로 뜬다.
# app과 db는 호스트로 열지 않는다(web만 연다).
services:
  web:
    build: ./ops/apache
    container_name: ekyc-web
    depends_on:
      app:
        condition: service_started
    environment:
      # Apache 설정(ops/apache/*.conf)이 ${EKYC_SERVER_NAME}, ${EKYC_PUBLIC_ORIGIN} 으로 읽는다
      EKYC_SERVER_NAME: ${WEB_SERVER_NAME:-localhost}
      EKYC_PUBLIC_ORIGIN: ${STACK_PUBLIC_BASE_URL:-https://localhost:9443}
    ports:
      # 8443은 모의 통신사가 쓰므로 웹서버는 기본 9080/9443을 쓴다
      - "${WEB_BIND:-127.0.0.1}:${WEB_HTTP_PORT:-9080}:80"
      - "${WEB_BIND:-127.0.0.1}:${WEB_HTTPS_PORT:-9443}:443"
    volumes:
      # 양호/취약 전환: ops/apply_vuln.sh 가 active.conf 를 바꿔 끼운다
      - ./ops/apache/active.conf:/usr/local/apache2/conf/ekyc.conf:ro
      # web.crt / web.key 가 있는 폴더
      - ${WEB_CERT_DIR:-./ops/certs}:/usr/local/apache2/conf/certs:ro
      - ./app/static:/srv/static:ro
    restart: unless-stopped

  app:
    build: .
    container_name: ekyc-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      EKYC_ENV: ${EKYC_ENV:-dev}
      # Apache가 덮어쓴 X-Real-IP만 믿는다
      TRUST_PROXY: "true"
      PUBLIC_BASE_URL: ${STACK_PUBLIC_BASE_URL:-https://localhost:9443}
      EKYC_SECRET_EKYC_DB: postgresql+psycopg://ekyc:${POSTGRES_PASSWORD:-ekyc}@db:5432/ekyc
      # 기본은 호스트에서 띄운 모의 통신사를 쓴다(운영에서는 별도 EC2·VPC 피어링)
      CARRIER_BASE_URL: ${STACK_CARRIER_BASE_URL:-https://host.docker.internal:8443}
      TEST_INBOX_ALLOWED_IPS: ${STACK_TEST_INBOX_ALLOWED_IPS:-127.0.0.1,::1,172.16.0.0/12}
      TEST_INBOX_FRAME_ANCESTORS: ${TEST_INBOX_FRAME_ANCESTORS:-http://localhost:3000,http://127.0.0.1:3000}
      TZ: Asia/Seoul
    volumes:
      # 시크릿·세션·업로드는 호스트와 공유한다. demo_reset.sh 한 번이면 양쪽 다 선다.
      - ./instance:/srv/ekyc/instance
      - ./carrier/certs:/srv/ekyc/carrier/certs:ro
      - ./seed:/srv/ekyc/seed
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 모의 통신사를 컨테이너로 띄운다(선택). 기본 스택에는 넣지 않는다. 호스트에서
  # `python -m carrier` 를 띄워 쓰는 로컬 흐름을 그대로 두기 위해서다.
  # 켜려면 .env 에 두 줄을 넣는다(호스트에 파이썬을 깔 필요가 없어진다):
  #   COMPOSE_PROFILES=carrier
  #   STACK_CARRIER_BASE_URL=https://carrier:8443
  # 호스트로 포트를 열지 않는다. app 컨테이너만 compose 네트워크로 부른다.
  carrier:
    build: .
    container_name: ekyc-carrier
    profiles: ["carrier"]
    command: ["python", "-m", "carrier"]
    environment:
      # 컨테이너 안에서는 다른 컨테이너가 부를 수 있게 전체 주소로 받는다
      CARRIER_BIND_HOST: 0.0.0.0
      CARRIER_PORT: "8443"
      TZ: Asia/Seoul
    volumes:
      # 시크릿과 통신사 DB(instance/carrier.sqlite3)를 app·호스트와 공유한다
      - ./instance:/srv/ekyc/instance
      # make_certs 가 여기에 인증서를 쓴다(app 은 읽기 전용으로 본다)
      - ./carrier/certs:/srv/ekyc/carrier/certs
      - ./seed:/srv/ekyc/seed:ro
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: ekyc-db
    environment:
      POSTGRES_USER: ekyc
      # 볼륨을 처음 만들 때만 적용된다. 나중에 바꾸려면 DB 안에서 ALTER USER 를 한다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekyc}
      POSTGRES_DB: ekyc
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - ekyc-pgdata:/var/lib/postgresql/data
      # 새 볼륨으로 처음 올릴 때 pytest용 ekyc_test DB를 만든다
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekyc -d ekyc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ekyc-pgdata:
