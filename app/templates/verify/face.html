{% extends "base.html" %}
{% block title %}얼굴 인증{% endblock %}
{% block content %}
{% if error %}
<div class="alert alert-danger" role="alert">{{ error }}</div>
{% endif %}

<div class="card mb-3">
  <div class="card-body">
    <h2 class="h5 card-title">얼굴 사진 등록</h2>
    <p class="card-text text-secondary small">
      신분증 사진과 대조한다. 남은 시간 약 {{ seconds_left // 60 }}분.
    </p>
    <p class="card-text text-secondary small">jpg 또는 png, {{ max_mb }}MB 이하. 얼굴이 하나만 보이게 촬영한다.</p>

    <form method="post" action="{{ url_for('verify.face_submit') }}" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="image">얼굴 사진</label>
        <input class="form-control" type="file" id="image" name="image" accept=".jpg,.jpeg,.png" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">인증 완료하기</button>
    </form>
  </div>
</div>

<form method="post" action="{{ url_for('verify.cancel') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit" class="btn btn-outline-secondary w-100">취소하고 돌아가기</button>
</form>
{% endblock %}
