{% extends "base.html" %}
{% block title %}신분증 촬영{% endblock %}
{% block content %}
{% if error %}
<div class="alert alert-danger" role="alert">{{ error }}</div>
{% endif %}

<div class="card mb-3">
  <div class="card-body">
    <h2 class="h5 card-title">신분증 사진 등록</h2>
    <p class="card-text text-secondary small">
      휴대폰 본인확인을 마쳤다({{ name_mask }}). 남은 시간 약 {{ seconds_left // 60 }}분.
    </p>
    <p class="card-text text-secondary small">
      jpg 또는 png, {{ max_mb }}MB 이하. 사진 영역에 얼굴이 하나만 보이게 촬영한다.
    </p>

    <form method="post" action="{{ url_for('verify.id_card_submit') }}" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="image">신분증 이미지</label>
        <input class="form-control" type="file" id="image" name="image" accept=".jpg,.jpeg,.png" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">등록하고 계속</button>
    </form>
  </div>
</div>

<form method="post" action="{{ url_for('verify.cancel') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit" class="btn btn-outline-secondary w-100">취소하고 돌아가기</button>
</form>
{% endblock %}
