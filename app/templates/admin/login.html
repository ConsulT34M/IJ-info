{% extends "admin/base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-5">
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <div class="card">
      <div class="card-body">
        <h2 class="h5 card-title">관리자 로그인</h2>
        <p class="card-text text-secondary small">아이디·비밀번호 확인 후 인증 앱 코드를 입력합니다.</p>
        <form method="post" action="{{ url_for('admin.login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="login_id">아이디</label>
            <input class="form-control" type="text" id="login_id" name="login_id" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">비밀번호</label>
            <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">다음</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
