{% extends "admin/base.html" %}
{% block title %}OTP 확인{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-5">
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <div class="card">
      <div class="card-body">
        <h2 class="h5 card-title">인증 앱 코드</h2>
        <p class="card-text text-secondary small">{{ login_id }} 계정의 6자리 코드를 입력해 주세요.</p>
        <form method="post" action="{{ url_for('admin.otp') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="code">인증 코드</label>
            <input class="form-control" type="text" id="code" name="code" maxlength="6"
                   inputmode="numeric" autocomplete="one-time-code" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">로그인</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
