<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}관리자{% endblock %} · A사 관리자 콘솔</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand bg-white border-bottom mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">A사 관리자 콘솔</span>
      {% if current_user.is_authenticated %}
      <div class="d-flex align-items-center gap-3">
        <a class="nav-link" href="{{ url_for('admin.verification_list') }}">인증 이력</a>
        <a class="nav-link" href="{{ url_for('admin.inquiry_list') }}">문의</a>
        <a class="nav-link" href="{{ url_for('admin.access_logs') }}">접속기록</a>
        {% if current_user.role == 'admin' %}
        <a class="nav-link" href="{{ url_for('admin.admin_list') }}">관리자</a>
        {% endif %}
        <span class="text-secondary small">{{ current_user.login_id }} ({{ current_user.role }})</span>
        <form method="post" action="{{ url_for('admin.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-sm btn-outline-secondary" type="submit">로그아웃</button>
        </form>
      </div>
      {% endif %}
    </div>
  </nav>
  <main class="container-fluid px-4 pb-5">
    {% block content %}{% endblock %}
    <p class="text-secondary small mt-4 mb-0">시각은 모두 KST(+09:00)로 표시합니다.</p>
  </main>
</body>
</html>
