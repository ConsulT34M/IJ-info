# A사 웹서버 설정 — **의도된 취약** (실습 전용)
#
# ops/apply_vuln.sh 가 이 파일을 쓰게 만들고, ops/revert_vuln.sh 가 되돌린다.
# 양호본(ekyc-good.conf)과 diff를 떠 보면 어디가 달라졌는지 바로 보인다.

ServerName localhost

# [취약] 웹서버 종류·버전과 OS가 응답 헤더와 에러 화면에 드러난다
ServerTokens Full
ServerSignature On
# [취약] TRACE 메서드 허용 (Cross-Site Tracing)
TraceEnable On

User www-data
Group www-data

# [취약] 요청 크기·시간 제한이 사실상 없다
LimitRequestBody 0
Timeout 300
KeepAliveTimeout 60

LogLevel warn
ErrorLog /proc/self/fd/2
# [취약] 질의 문자열까지 접근 로그에 남는다 (검색어·토큰 유출)
CustomLog /proc/self/fd/1 combined

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory "/srv/static">
    # [취약] 디렉터리 목록이 그대로 노출되고 심볼릭 링크를 따라간다
    Options +Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# [취약] 숨김 파일·백업 파일 차단 규칙이 없다

ProxyRequests Off
ProxyPreserveHost On

<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile /usr/local/apache2/conf/certs/web.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/certs/web.key
    # [취약] 낡은 프로토콜과 약한 암호화 스위트를 함께 받는다
    SSLProtocol all -SSLv3
    SSLCipherSuite HIGH:MEDIUM:!aNULL

    # [취약] HSTS 없음, 백엔드 정보 헤더를 지우지 않는다
    # [취약] 메서드 제한 없음 (PUT·DELETE·OPTIONS·TRACE 그대로)
    # [취약] 고정 에러 문구 없음 → Apache 기본 화면(버전 포함)이 나간다

    # [취약] 클라이언트가 보낸 X-Real-IP를 그대로 넘긴다 (접속기록 위조)
    RequestHeader set X-Forwarded-Proto "https"

    Alias /static /srv/static
    ProxyPass /static !
    ProxyPass / http://app:8000/ timeout=300
    ProxyPassReverse / http://app:8000/
</VirtualHost>

<VirtualHost *:80>
    ServerName localhost
    # [취약] https로 보내지 않고 평문 그대로 서비스한다
    Alias /static /srv/static
    ProxyPass /static !
    ProxyPass / http://app:8000/ timeout=300
    ProxyPassReverse / http://app:8000/
</VirtualHost>
