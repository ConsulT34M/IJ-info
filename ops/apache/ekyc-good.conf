# A사 웹서버 설정 — 양호 기준 (금취분평 웹서버 / 주통기 Apache 항목)
#
# 이 파일이 기본이다. 취약 설정은 ops/apply_vuln.sh 로 바꿔 끼운다.
# 괄호 안은 어떤 점검 항목을 겨냥한 것인지 적어 둔 것이다.

ServerName localhost

# ── 웹서버 정보 노출 ────────────────────────────────────────────────
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# ── 프로세스 권한: root로 돌리지 않는다 ──────────────────────────────
User www-data
Group www-data

# ── 요청 크기·시간 제한 (자동화 공격·대용량 요청) ────────────────────
LimitRequestBody 10485760
LimitRequestFields 60
LimitRequestFieldSize 8190
LimitRequestLine 8190
Timeout 30
KeepAliveTimeout 5

LogLevel warn
ErrorLog /proc/self/fd/2
# 질의 문자열은 남기지 않는다. 검색어·토큰이 접근 로그로 새지 않게 한다.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" ekyc
CustomLog /proc/self/fd/1 ekyc

# ── 디렉터리 접근: 기본은 전부 막고 필요한 곳만 연다 ─────────────────
<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

<Directory "/srv/static">
    # 디렉터리 목록 노출 금지, 심볼릭 링크 추적 금지
    Options -Indexes -FollowSymLinks -Includes -ExecCGI
    AllowOverride None
    Require all granted
</Directory>

ProxyRequests Off
ProxyPreserveHost On

<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile /usr/local/apache2/conf/certs/web.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/certs/web.key
    # 낡은 프로토콜·암호화 스위트는 받지 않는다
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES:!RC4:!EXPORT
    SSLHonorCipherOrder on
    SSLCompression off

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    # 백엔드(Gunicorn)가 붙인 Server 헤더까지 지운다.
    # always 테이블만으로는 프록시 응답에서 안 지워져 둘 다 건다.
    Header unset Server
    Header always unset Server
    Header unset X-Powered-By
    Header always unset X-Powered-By

    # 허용 메서드: 쓰기 계열은 받지 않는다.
    #
    # <Location "/"> + <LimitExcept> 를 쓰면 안 된다. Location 섹션은 설정 파일 순서대로
    # 병합되면서 **앞서 정해진 인가 규칙을 통째로 덮어쓴다.** LimitExcept 는 GET 에
    # 적용되지 않으므로 GET 요청의 인가 규칙이 '빈 집합'이 되고, 그러면 Apache 는
    # "요구 조건 없음 = 허용"으로 본다. 그 결과 **vhost 안의 모든 Directory·Files
    # 단위 Require 가 조용히 무력화된다.** (D95)
    #
    # mod_rewrite 로 막으면 인가 병합을 건드리지 않는다.
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} !^(GET|POST|HEAD)$
    RewriteRule .* - [F]

    # 숨김 파일과 백업·설정·소스 파일은 내려주지 않는다
    <LocationMatch "/\.|\.(bak|old|orig|save|swp|sql|env|ini|conf|py|pyc|sqlite3?)$">
        Require all denied
    </LocationMatch>

    # 에러 화면은 서버 정보를 드러내지 않는 고정 문구로
    ErrorDocument 400 "요청을 처리할 수 없습니다."
    ErrorDocument 403 "접근할 수 없습니다."
    ErrorDocument 404 "페이지를 찾을 수 없습니다."
    ErrorDocument 500 "일시적인 오류가 발생했습니다."

    # 실제 접속 주소로 덮어쓴다. 클라이언트가 보낸 값은 버린다.
    RequestHeader unset X-Real-IP
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"

    Alias /static /srv/static
    ProxyPass /static !
    ProxyPass / http://app:8000/ timeout=60
    ProxyPassReverse / http://app:8000/
</VirtualHost>

# 평문으로 들어오면 https로 보낸다
<VirtualHost *:80>
    ServerName localhost
    RewriteEngine On
    RewriteRule ^/?(.*) https://localhost:9443/$1 [R=301,L]
</VirtualHost>
