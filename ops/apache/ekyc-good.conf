# A사 웹서버 설정 — 양호 기준
#
# **최소한만 둔다.** 설정이 많아질수록 서로 간섭해서, 설정 파일만 읽으면 양호로 보이는데
# 실제로는 안 먹는 상태가 생긴다(실제로 그랬다 — D95). 그래서 규칙을 하나 정했다:
#
#   여기 있는 지시어는 전부 `ops/check_web.sh` 로 동작을 확인한다.
#   확인할 수 없거나 다른 지시어와 얽히는 설정은 넣지 않는다.
#
# 취약 설정은 ops/apply_vuln.sh 로 바꿔 끼운다.
# 주의: Apache 는 줄 끝 주석(지시어 뒤 #)을 지원하지 않는다. 주석은 반드시 별도 줄에.

ServerName localhost

# ── 웹서버 정보 노출 ────────────────────────────────────────────────
# 응답 Server 헤더를 "Apache" 까지만 / 에러 화면의 버전·호스트 서명 제거
ServerTokens Prod
ServerSignature Off
# TRACE 메서드 차단 (Cross-Site Tracing)
TraceEnable Off

# ── 요청 크기·시간 제한 ─────────────────────────────────────────────
# 10MB. 앱의 업로드 상한(5MB)보다 넉넉하게 둔다.
LimitRequestBody 10485760
Timeout 30
KeepAliveTimeout 5

# ── 로그 ────────────────────────────────────────────────────────────
LogLevel warn
ErrorLog /proc/self/fd/2
# 질의 문자열(%q)을 남기지 않는다. 검색어·토큰이 접근 로그로 새지 않게 한다.
LogFormat "%h %t \"%m %U\" %>s %b \"%{User-Agent}i\"" ekyc
CustomLog /proc/self/fd/1 ekyc

# ── 파일 접근: 기본은 전부 막고 정적 폴더만 연다 ─────────────────────
<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

<Directory "/srv/static">
    # 목록 노출·심볼릭 링크 추적 금지
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

ProxyRequests Off
ProxyPreserveHost On

<VirtualHost *:443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile /usr/local/apache2/conf/certs/web.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/certs/web.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES:!RC4:!EXPORT
    SSLHonorCipherOrder on

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    # 백엔드(Gunicorn)가 붙인 Server 헤더를 지운다. 프록시 응답은 always 만으로 안 지워진다.
    Header unset Server
    Header always unset Server

    # 숨김 파일·백업·설정·소스 파일은 내려주지 않는다.
    #
    # 이 vhost에 Location 계열 섹션은 **이것 하나뿐이다.** 둘 이상 두면 병합 순서에 따라
    # 서로의 인가 규칙을 덮어쓴다(D95). 하나로 유지한다.
    <LocationMatch "/\.|\.(bak|old|orig|save|swp|sql|env|ini|conf|py|pyc|sqlite3?)$">
        Require all denied
    </LocationMatch>

    # 에러 화면은 서버 정보를 드러내지 않는 고정 문구로
    ErrorDocument 403 "접근할 수 없습니다."
    ErrorDocument 404 "페이지를 찾을 수 없습니다."
    ErrorDocument 500 "일시적인 오류가 발생했습니다."

    # 실제 접속 주소로 덮어쓴다. 클라이언트가 보낸 값은 버린다(앱의 TRUST_PROXY와 짝).
    RequestHeader unset X-Real-IP
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"

    Alias /static /srv/static
    ProxyPass /static !
    ProxyPass / http://app:8000/ timeout=60
    ProxyPassReverse / http://app:8000/
</VirtualHost>

# 평문으로 들어오면 https로 보낸다
<VirtualHost *:80>
    ServerName localhost
    RewriteEngine On
    RewriteRule ^/?(.*) https://localhost:9443/$1 [R=301,L]
</VirtualHost>
